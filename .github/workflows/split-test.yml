name: split-test

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:
    inputs:
      prNumber:
        required: false
        type: string

permissions: {}

jobs:
  trigger:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh workflow run split-test.yml --ref "${{ github.event.repository.default_branch }}" -f prNumber="$PR_NUMBER"

  reconcile:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: split-test-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - env:
          PR_NUMBER: ${{ inputs.prNumber }}
        run: echo "reconcile for PR $PR_NUMBER"; sleep 25
